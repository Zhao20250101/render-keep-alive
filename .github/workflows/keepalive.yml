name: Render Keep-Alive

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Render services
        env:
          RENDER_URLS: ${{ secrets.RENDER_URLS }}
        run: |
          if [ -z "$RENDER_URLS" ]; then
            echo "::error::RENDER_URLS secret is not set"
            exit 1
          fi
          echo "Running at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          fail=0
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            echo "--- Pinging $url ---"
            curl -sS -m 60 --retry 3 --retry-delay 5 --retry-connrefused \
              -o /dev/null -w "HTTP status: %{http_code}\nTime: %{time_total}s\n" \
              "$url" || fail=1
          done <<< "$RENDER_URLS"
          exit $fail
