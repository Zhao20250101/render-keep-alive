name: Render Keep-Alive

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Ping Render service
        run: |
          URL="https://quickly-vertex.onrender.com"
          echo "Pinging $URL at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          curl -sS -m 60 --retry 3 --retry-delay 5 --retry-connrefused \
            -o /dev/null -w "HTTP status: %{http_code}\nTime: %{time_total}s\n" \
            "$URL" || true
