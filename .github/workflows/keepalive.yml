name: Render Keep-Alive

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Ping Render service
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "::error::RENDER_URL secret is not set"
            exit 1
          fi
          echo "Pinging $RENDER_URL at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          curl -sS -m 60 --retry 3 --retry-delay 5 --retry-connrefused \
            -o /dev/null -w "HTTP status: %{http_code}\nTime: %{time_total}s\n" \
            "$RENDER_URL" || true
